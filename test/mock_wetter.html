<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glass Home · Mock Wetter-Popup</title>
<style>
html,body{margin:0;color:#eef1f4;font-family:Inter,system-ui,sans-serif}
body{min-height:100vh;padding:12px;box-sizing:border-box;background:radial-gradient(60vw 60vw at 5% 0%,rgba(120,130,145,.32),transparent 65%),linear-gradient(160deg,#141619,#22262b) fixed}
#hd{height:150px}
</style></head><body>
<div id="hd"></div>
<script src="../dist/glass-home.js"></script>
<script>
// Wetter-Entität für die Vorhersage + GeoSphere-Station LEIBNITZ (Werte wie bei Dominik am 8.11.)
const S = {}, E = {};
const now = new Date().toISOString();
const add = (id, state, attrs, dev) => { S[id] = { entity_id: id, state, attributes: attrs, last_changed: now, last_updated: now }; E[id] = { entity_id: id, labels: [], device_id: dev }; };
add('weather.forecast_home', 'cloudy', { friendly_name: 'Forecast Home', temperature: 3, temperature_unit: '°C', humidity: 90, pressure: 1027, wind_speed: 4, wind_speed_unit: 'km/h' });
add('weather.leibnitz', 'unknown', { friendly_name: 'LEIBNITZ' }, 'geo');
const g = (n, v, dc, u) => add('sensor.leibnitz_' + n.toLowerCase().replace(/ /g, '_'), String(v), { friendly_name: 'LEIBNITZ ' + n, device_class: dc, unit_of_measurement: u }, 'geo');
g('Dew Point', 0.5, 'temperature', '°C'); g('Dew Point Average', 0.5, 'temperature', '°C'); g('Humidity', 96, 'humidity', '%');
g('Precipitation', 0, 'precipitation', 'mm'); g('Pressure', 994.3, 'atmospheric_pressure', 'hPa'); g('Pressure at Sea Level', 1027.5, 'atmospheric_pressure', 'hPa');
g('Temperature', 1.3, 'temperature', '°C'); g('Temperature Average', 1.2, 'temperature', '°C'); g('Top Wind Bearing', 200, null, '°');
g('Top Wind Speed', 2.52, 'wind_speed', 'km/h'); g('Wind Bearing', 195, null, '°'); g('Wind Speed', 1.44, 'wind_speed', 'km/h');
const conds = ['cloudy', 'cloudy', 'fog', 'fog', 'cloudy', 'partlycloudy', 'sunny', 'sunny', 'partlycloudy', 'rainy'];
const hass = {
  states: S, entities: E, devices: { geo: { name: 'LEIBNITZ' } }, areas: {}, user: { name: 'Dominik' },
  callService() {}, callWS: async () => ({}),
  connection: { subscribeMessage(cb, msg) {
    const t0 = new Date(); t0.setMinutes(0, 0, 0);
    const f = msg.forecast_type === 'hourly'
      ? Array.from({ length: 48 }, (_, i) => { const d = new Date(+t0 + i * 36e5), h = d.getHours();
          return { datetime: d.toISOString(), temperature: 1 + 6 * Math.max(0, Math.sin((h - 8) / 12 * Math.PI)), condition: h < 7 || h > 17 ? (i > 20 && i < 26 ? 'rainy' : 'cloudy') : conds[h % 10], precipitation_probability: i > 20 && i < 26 ? 40 + i : 0 }; })
      : Array.from({ length: 8 }, (_, i) => ({ datetime: new Date(+t0 + i * 864e5).toISOString(), temperature: [7, 9, 6, 8, 11, 10, 5, 7][i], templow: [0, 1, 2, -1, 3, 4, 0, 1][i], condition: conds[(i * 3) % 10], precipitation_probability: [10, 0, 70, 20, 0, 0, 80, 30][i] }));
    setTimeout(() => cb({ forecast: f }), 20);
    return Promise.resolve(() => {});
  } },
};
const c = document.createElement('glass-home-header'); c.setConfig({ part: 'weather', weather: 'weather.forecast_home', forecast_days: 7 });
document.getElementById('hd').appendChild(c); c.hass = hass;
if (location.search.includes('open')) setTimeout(() => c.shadowRoot.querySelector('.wx').click(), 100);
</script></body></html>
